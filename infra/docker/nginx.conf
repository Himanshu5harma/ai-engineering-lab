server {
    listen 8080 default_server;
    server_name _;
    default_type application/json;
    return 400 '{"error":{"code":"host_denied","message":"Unexpected hostname"}}';
}
server {
    listen 8080;
    server_name localhost 127.0.0.1;
    # server_name alone does not reject unknown hosts. Validate the raw header too,
    # including requests whose absolute URI supplied a different host.
    if ($http_host !~* "^(localhost|127\.0\.0\.1)(:[0-9]+)?$") {
        return 400;
    }
    root /usr/share/nginx/html;
    client_max_body_size 80k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / { try_files $uri $uri/ /index.html; }
}
