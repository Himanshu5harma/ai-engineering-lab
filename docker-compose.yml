name: ai-engineering-lab
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ael
      POSTGRES_USER: ael
      POSTGRES_PASSWORD: ael_local
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ael -d ael"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      AEL_DATABASE_URL: postgresql+psycopg://ael:ael_local@db:5432/ael
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
volumes:
  postgres_data:
